[package]
name = "meme-vault"
version = "0.1.0"
description = "Meme Vault desktop application"
authors = ["you"]
edition = "2021"

[lib]
name = "meme_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled", "vtab"] }
thiserror = "2"
sha2 = "0.10"
walkdir = "2"
image = { version = "0.25", default-features = true, features = ["webp"] }
arboard = "3"
